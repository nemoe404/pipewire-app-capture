# CI: the static gate, then the integration job that runs the pipewire-labelled tests against a
# real PipeWire session with a null sink. Hosted runner on purpose: this repository is public, so
# a self-hosted runner would execute code from pull requests on a machine that owns real audio.
name: ci

on:
  push:
    branches: [main, release-build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo bash scripts/ci/install-toolchain.sh 21
      - name: Gate (format, legs, cppcheck, clang-tidy)
        env:
          CLANG_FORMAT: clang-format-21
          CLANG_TIDY: clang-tidy-21
        run: scripts/check.sh
      - name: Show the failing leg's test log
        if: failure()
        run: |
          for f in build/gate/logs/*.ctest.log; do
            [ -f "$f" ] || continue
            echo "== $f"
            tail -n 120 "$f"
          done
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: build/gate/logs/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-26.04
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo bash scripts/ci/install-toolchain.sh 21
      # Session and tests share one step: a PipeWire started in one dbus-run-session dies when that
      # step exits, so the daemons must live for the whole test run.
      - name: PipeWire session with a null sink, then pipewire-labelled tests (fail on any skip)
        run: dbus-run-session -- bash -c 'scripts/ci/pipewire-session.sh && scripts/ci/run-live.sh'
